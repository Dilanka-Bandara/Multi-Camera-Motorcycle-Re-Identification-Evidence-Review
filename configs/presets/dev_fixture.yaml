detector:
  mode: groundtruth
embedding:
  backend: dummy
cameras:
  B:
    start_time_s: 4.0
topology:
  clock_offset:
    expected_transit_s: 11.5  # Midpoint of the scenario travel range (8 to 15 s).
  min_transit_s: 5.0
  max_transit_s: 20.0
  expected_exit_dir_A: [1, 0]
  expected_entry_dir_B: [1, 0]
matching:
  # Selected with the verifier thresholds below on separately seeded tuning fixtures
  # (scripts/fit_fixture_calibrator.py); both lookalike pairs stay flagged ambiguous.
  ambiguity_margin: 0.03
  min_match_score: 0.65
verifier:
  # Dummy-embedder and SIFT features need their own calibration coefficients.
  calibrator: calibrator_dev_fixture.json
  p_accept: 0.5
  p_reject: 0.1
  keypoints:
    backend: sift  # Deterministic CPU fixture. General runs use local ALIKED + LightGlue.
runtime:
  data_dir: /app/data/user
