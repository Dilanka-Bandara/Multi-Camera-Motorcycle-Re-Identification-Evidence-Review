detector:
  mode: groundtruth
embedding:
  backend: dummy
cameras:
  B:
    start_time_s: 4.0
topology:
  clock_offset:
    expected_transit_s: 11.5  # Midpoint of the scenario travel range (8 to 15 s).
  min_transit_s: 5.0
  max_transit_s: 20.0
  expected_exit_dir_A: [1, 0]
  expected_entry_dir_B: [1, 0]
matching:
  # Synthetic sprites share a background and have unusually close appearance scores.
  ambiguity_margin: 0.07
verifier:
  keypoints:
    backend: sift  # Deterministic CPU fixture. General runs use local ALIKED + LightGlue.
runtime:
  data_dir: /app/data/user
