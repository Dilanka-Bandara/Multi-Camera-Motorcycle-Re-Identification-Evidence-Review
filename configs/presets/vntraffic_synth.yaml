inputs:
  directory: user/datasets/vntraffic_synth
target:
  classes:
  - motorcycle
detector:
  mode: yolo
cameras:
  B:
    start_time_s: 6.0
topology:
  direction: A_to_B
  min_transit_s: 0
  max_transit_s: 35.0
  clock_offset:
    mode: fixed
    fixed_s: 6.0
matching:
  ambiguity_margin: 0.02
  min_match_score: 0.45
verifier:
  p_accept: 0.5
  p_reject: 0.1
